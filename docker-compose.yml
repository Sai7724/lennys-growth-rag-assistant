version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lenny_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: lenny_assistant
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lenny_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lenny_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password123@db:5432/lenny_assistant
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DEFAULT_PROVIDER: ollama
      TRANSCRIPTS_DIR: /app/data/transcripts
      TRANSCRIPTS_REPO_URL: ${TRANSCRIPTS_REPO_URL:-https://github.com/ChatPRD/lennys-podcast-transcripts.git}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GLM_API_KEY: ${GLM_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Allows running ingestion inside the container against host transcripts.
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lenny_frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data: